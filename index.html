<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Gerenciamento de alunos</h1>

    <form id="formulario-aluno">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </div>

        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" step="1" required>
        </div>

        <div>
            <label for="curso">Curso:</label>
            <select id="curso" required>

                <option value="">Selecione um curso</option>

                <option value="JavaScript">JavaScript</option>

                <option value="Python">Python</option>

                <option value="Java">Java</option>

            </select>
        </div>

        <div>
            <label for="notaFinal">Nota final:</label>
            <input type="number" id="notaFinal"
                   min="0" max="10" step="0.1" required>
        </div>

        <button type="submit" id="botao-salvar">Cadastrar</button>
    </form>

    <h2>Alunos cadastrados</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota final</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
    </table>

    <h2>Relatórios</h2>

    <button type="button" id="btn-aprovados">Alunos aprovados</button>
    <button type="button" id="btn-media-notas">Média das notas</button>
    <button type="button" id="btn-media-idades">Média das idades</button>
    <button type="button" id="btn-nomes">Nomes em ordem alfabética</button>
    <button type="button" id="btn-cursos">Quantidade por curso</button>

    <pre id="resultado-relatorio" aria-live="polite"></pre>
</body>
</html>
